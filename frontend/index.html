<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shorten long URLs instantly. Create short, shareable links for free." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1D4ED8" />
    <link rel="canonical" href="https://sh.wyzwyz.xyz" />

    <!-- Open Graph -->
    <meta property="og:title" content="URL Shortener" />
    <meta property="og:description" content="Shorten long URLs instantly. Create short, shareable links for free." />
    <meta property="og:url" content="https://sh.wyzwyz.xyz" />
    <meta property="og:type" content="website" />

    <title>URL Shortener</title>

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "URL Shortener",
      "alternateName": "sh.wyzwyz",
      "description": "Shorten long URLs instantly. Create shareable links and track real-time analytics with our URL management tool.",
      "url": "https://sh.wyzwyz.xyz",
      "image": "https://sh.wyzwyz.xyz/logo.png",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript and HTML5",
      "featureList": [
        "Instant URL shortening",
        "Customizable shareable links",
        "Click analytics dashboard",
        "Secure user authentication"
      ],
      "potentialAction": [
        {
          "@type": "LoginAction",
          "target": "https://sh.wyzwyz.xyz/login"
        },
        {
          "@type": "CreateAction",
          "name": "Shorten a Link",
          "target": "https://sh.wyzwyz.xyz/"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
