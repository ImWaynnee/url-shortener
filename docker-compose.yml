name: 'urlshortener-backend'
services:
  backend:
    container_name: urlshortener_backend
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIRECT_DOMAIN=http://${NGINX_REDIRECT_HOST}
      - PORT=${BACKEND_PORT:-3000}
    expose:
      - '${BACKEND_PORT:-3000}'
    volumes:
      # mount source so nest --watch picks up changes
      - ./backend/src:/app/backend/src
    depends_on:
      - postgres
      - redis
    networks:
      - urlshortener_network

  nginx:
    container_name: urlshortener_nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - NGINX_API_HOST=${NGINX_API_HOST}
      - NGINX_REDIRECT_HOST=${NGINX_REDIRECT_HOST}
    depends_on:
      - backend
    networks:
      - urlshortener_network
      
  postgres:
    container_name: urlshortener_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - urlshortener_network

  redis:
    container_name: urlshortener_redis
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - urlshortener_network

  prisma-studio:
    container_name: urlshortener_prisma_studio
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.dev
    profiles:
      - tools
    env_file:
      - ./backend/.env
    ports:
      - '${PRISMA_STUDIO_PORT:-5555}:5555'
    command: ['npx', 'prisma', 'studio', '--port', '5555', '--browser', 'none']
    depends_on:
      - postgres
    networks:
      - urlshortener_network

networks:
  urlshortener_network:
    driver: bridge

volumes:
  postgres_data:
